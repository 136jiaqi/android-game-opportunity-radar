name: Collect and score public snapshots
on:
  workflow_dispatch:
  schedule: [{cron: '17 2 * * *'}]
permissions: {contents: write}
concurrency: {group: public-data-snapshot, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
      - run: python scripts/score.py
      - name: Commit valid snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.csv
          git diff --cached --quiet || git commit -m 'chore: refresh public data snapshot'
          git push
